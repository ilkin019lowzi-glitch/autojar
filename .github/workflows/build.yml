name: Auto Build JAR
on:
  workflow_dispatch:
  push:
    paths:
      - 'ilkindl.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Unzip and Build JAR
        run: |
          rm -rf build_dir out_jar jar_staging
          mkdir -p build_dir out_jar jar_staging

          if [ ! -f "ilkindl.zip" ]; then
            echo "HATA: Repoda ilkindl.zip bulunamadi!"
            ls -la
            exit 1
          fi

          unzip -q ilkindl.zip -d build_dir
          chmod -R u+rwX build_dir 2>/dev/null || true

          find build_dir -path "*/test/*" -o -name "*Test.java" -o -name "*Test.class" -exec rm -rf {} + 2>/dev/null || true

          POM=$(find build_dir -name "pom.xml" 2>/dev/null | head -n 1)
          GRADLE=$(find build_dir -name "build.gradle*" 2>/dev/null | head -n 1)

          MAVEN_OK=0
          if [ -n "$POM" ]; then
            echo "Maven projesi bulundu, derleniyor..."
            POM_DIR="$(dirname "$POM")"
            if mvn -f "$POM" clean package -DskipTests -Dmaven.antrun.skip=true; then
              find "$POM_DIR" -type f -name "*.jar" ! -name "*original*" ! -name "*sources*" ! -name "*javadoc*" -exec cp {} "$GITHUB_WORKSPACE/out_jar/" \; 2>/dev/null || true
              if [ -n "$(ls -A "$GITHUB_WORKSPACE/out_jar" 2>/dev/null)" ]; then
                MAVEN_OK=1
              fi
            else
              echo "Uyari: Maven antrun/eksik dosya nedeniyle durdu, mevcut dosyalar paketleniyor..."
            fi
          fi

          if [ "$MAVEN_OK" -eq 0 ] && [ -n "$GRADLE" ]; then
            echo "Gradle projesi bulundu, derleniyor..."
            GRADLE_DIR="$(dirname "$GRADLE")"
            (
              cd "$GRADLE_DIR"
              if [ -f "gradlew" ]; then
                chmod +x gradlew
                ./gradlew build -x test
              else
                gradle build -x test
              fi
            ) && find "$GRADLE_DIR" -type f -name "*.jar" ! -name "*original*" ! -name "*sources*" ! -name "*javadoc*" -exec cp {} "$GITHUB_WORKSPACE/out_jar/" \; 2>/dev/null || true
          fi

          if [ -z "$(ls -A out_jar 2>/dev/null)" ]; then
            echo "Erisilebilen mevcut dosyalar toplanip tek JAR yapiliyor..."

            find build_dir -type f ! -name "*.java" ! -name "*.zip" 2>/dev/null | while read -r f; do
              if [ -r "$f" ]; then
                rel="${f#build_dir/}"
                rel="${rel#ilkindlcClient_merged/}"
                rel="${rel#ilkindlcClient/}"
                rel="${rel#ilkindlcClient_original/}"
                rel="${rel#src/main/resources/}"
                rel="${rel#src/main/java/}"
                rel="${rel#src/}"
                mkdir -p "jar_staging/$(dirname "$rel")" 2>/dev/null || true
                cp "$f" "jar_staging/$rel" 2>/dev/null || true
              fi
            done

            find build_dir -name "*.java" 2>/dev/null > sources.txt || true
            if [ -s sources.txt ]; then
              javac -encoding UTF-8 -cp "jar_staging:." -d jar_staging @sources.txt 2>/dev/null || echo "Uyari: Bazi .java dosyalarinda bagimlilik eksik olabilir, mevcut dosyalar paketleniyor..."
            fi

            jar cf out_jar/ilkindlcClient-built.jar -C jar_staging .
          fi

          ls -lh out_jar/

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jar
          path: out_jar/*.jar
          
