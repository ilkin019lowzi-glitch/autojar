name: Auto Build JAR
on:
  workflow_dispatch:
  push:
    paths:
      - 'ilkindlcc.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Unzip and Build JAR
        run: |
          rm -rf build_dir out_jar jar_staging base_jar_dir compile_cp
          mkdir -p build_dir out_jar jar_staging base_jar_dir compile_cp

          if [ ! -f "ilkindlcc.zip" ]; then
            echo "HATA: Repoda ilkindlcc.zip bulunamadi!"
            ls -la
            exit 1
          fi

          unzip -q ilkindlcc.zip -d build_dir
          chmod -R u+rwX build_dir 2>/dev/null || true

          # Test dosyalarini ve stub klasorunu cikis paketinden ayir
          find build_dir -path "*/test/*" -o -path "*/stubs/*" -o -name "*Test.java" -o -name "*Test.class" -exec rm -rf {} + 2>/dev/null || true

          # 1. Varsa hazir temel JAR dosyasini jar_staging içine ac
          BASE_JAR=$(find build_dir -type f -name "*.jar" | head -n 1)
          if [ -n "$BASE_JAR" ]; then
            echo "Temel JAR bulundu ve aciliyor: $BASE_JAR"
            unzip -qo "$BASE_JAR" -d jar_staging 2>/dev/null || true
            cp "$BASE_JAR" compile_cp/base.jar 2>/dev/null || true
          fi

          # 2. Resources altindaki ses, sounds.json ve diger kaynaklari ekle
          find build_dir -path "*/resources/*" -type f 2>/dev/null | while read -r rf; do
            if [ -r "$rf" ]; then
              rrel="${rf#*resources/}"
              mkdir -p "jar_staging/$(dirname "$rrel")" 2>/dev/null || true
              cp "$rf" "jar_staging/$rrel" 2>/dev/null || true
            fi
          done

          # 3. ilkindlc/configs ve ilkindlc/misc gibi proje dosyalarini ekle
          find build_dir -path "*/ilkindlc/*" -type f 2>/dev/null | while read -r cf; do
            if [ -r "$cf" ]; then
              crel="ilkindlc/${cf#*ilkindlc/}"
              mkdir -p "jar_staging/$(dirname "$crel")" 2>/dev/null || true
              cp "$cf" "jar_staging/$crel" 2>/dev/null || true
            fi
          done

          # 4. Kaynak .java dosyalarini src/ kokune gore derle ve jar_staging icine yaz
          find build_dir -name "*.java" 2>/dev/null > sources.txt || true
          if [ -s sources.txt ]; then
            echo "Java kaynaklari derleniyor..."
            CP="jar_staging:compile_cp/*"
            while IFS= read -r jf; do
              [ -r "$jf" ] || continue
              if [[ "$jf" == *"/src/"* ]]; then
                src_root="${jf%%/src/*}/src"
                javac -encoding UTF-8 -cp "$CP" -sourcepath "$src_root" -d jar_staging "$jf" 2>/dev/null || true
              else
                javac -encoding UTF-8 -cp "$CP" -d jar_staging "$jf" 2>/dev/null || true
              fi
            done < sources.txt
          fi

          # 5. Tek bir final JAR olustur
          jar cf out_jar/ilkindlcc-built.jar -C jar_staging .
          ls -lh out_jar/

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jar
          path: out_jar/*.jar
          
